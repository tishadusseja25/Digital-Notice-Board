services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    # These differ inside the container, so they override whatever .env says for local development.
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://noticeboard_app:${MONGO_APP_PASSWORD}@mongo:27017/noticeboard?authSource=noticeboard
    ports:
      - "3000:3000"
    # The health check itself is defined in the Dockerfile (calls /api/health).

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nb_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?set MONGO_ADMIN_PASSWORD in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
      MONGO_RO_PASSWORD: ${MONGO_RO_PASSWORD:?set MONGO_RO_PASSWORD in .env}
    # Authentication is on because a root user is defined; bound to localhost only.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "nb_admin",
          "-p",
          "${MONGO_ADMIN_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
